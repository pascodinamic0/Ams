<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="ShuleOS">
  <defs>
    <linearGradient id="star" x1="64" y1="26" x2="64" y2="78">
      <stop offset="0%" stop-color="#FFE49A"/>
      <stop offset="42%" stop-color="#F6B23A"/>
      <stop offset="100%" stop-color="#E07A14"/>
    </linearGradient>
    <radialGradient id="starCore" cx="64" cy="52" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF6C8"/>
      <stop offset="55%" stop-color="#F7C14A"/>
      <stop offset="100%" stop-color="#E8912D" stop-opacity="0"/>

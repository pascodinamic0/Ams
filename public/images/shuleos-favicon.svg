    stroke-width="3.2"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Open book -->
  <path
    d="M64 98C52 90 34 86 22 88C22 74 34 64 48 62C54 61 60 62 64 66C68 62 74 61 80 62C94 64 106 74 106 88C94 86 76 90 64 98Z"

    <linearGradient id="book" x1="28" y1="70" x2="100" y2="104">
      <stop offset="0%" stop-color="#0A3A36"/>
      <stop offset="55%" stop-color="#0F4F49"/>
      <stop offset="100%" stop-color="#165E56"/>

  <path d="M30 78C40 74 52 74 64 82" stroke="#D7E7E4" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <path d="M98 78C88 74 76 74 64 82" stroke="#D7E7E4" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

